name: lsppt-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: lsppt-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lsppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsppt_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-lsppt_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lsppt-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lsppt}:${POSTGRES_PASSWORD:-lsppt_prod_password}@postgres:5432/${POSTGRES_DB:-lsppt_tracker}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lsppt-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_prod_data:
