# =============================================================
# LSPPT Tracker - Development Environment
#
#   React + Vite  ->  NestJS  ->  PostgreSQL
#
# Hot reload strategy:
#   - Source code di-bind mount dari host (tidak perlu rebuild image)
#   - node_modules disimpan di named volume (terpisah dari host)
#   - `npm install` dijalankan saat container start, jadi menambah
#     dependency cukup edit package.json lalu restart container:
#       docker compose -f docker-compose.dev.yml restart backend frontend
# =============================================================

name: lsppt-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: lsppt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lsppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsppt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lsppt_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lsppt-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      # File watching via polling agar hot reload andal di bind mount (Windows/macOS)
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lsppt}:${POSTGRES_PASSWORD:-lsppt_dev_password}@postgres:5432/${POSTGRES_DB:-lsppt_tracker}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lsppt-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
